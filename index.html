<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS home-screen icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Viewport: prevent zoom-on-input, support iPhone notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- Status bar tint (Android Chrome / PWA installed) -->
    <meta name="theme-color" content="#060d09" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA fullscreen hints (modern + iOS legacy) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CrymadX" />

    <!-- Microsoft tile -->
    <meta name="msapplication-TileColor" content="#060d09" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- SEO -->
    <meta name="description" content="CrymadX — Crypto exchange. Trade, stake, spend. AI-powered." />

    <!-- Open Graph -->
    <meta property="og:title" content="CrymadX" />
    <meta property="og:description" content="Trade, stake, spend. AI-powered crypto." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Format detection: stop iOS from auto-linking phone numbers / addresses -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>CrymadX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
