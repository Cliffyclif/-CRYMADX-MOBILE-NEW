# Nixpacks build config for Railway.
#
# Node 22 (LTS, npm 10.9+) — handles lockfiles generated by both npm 10
# and npm 11 reliably. We use `npm install` instead of `npm ci` because
# devs may regenerate the lockfile on different Node versions; install
# tolerates platform-specific optional dep variations whereas ci is strict.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
